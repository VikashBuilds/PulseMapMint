name: PulseMap Radar

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Run a single collector (id) or all"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  scan:
    name: scan-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: hn_top
            module: hn.py
            args: "hn_top top 30"
          - id: hn_best
            module: hn.py
            args: "hn_best best 30"
          - id: hn_ask_show
            module: hn.py
            args: "hn_ask_show ask_show 20"
          - id: reddit_all
            module: reddit.py
            args: "reddit_all all world 25"
          - id: reddit_world_science
            module: reddit.py
            args: "reddit_world_science worldnews,science,futurism,space world 25"
          - id: reddit_tech_startups
            module: reddit.py
            args: "reddit_tech_startups technology,programming,startups,gadgets,artificial tech 25"
          - id: reddit_finance_crypto
            module: reddit.py
            args: "reddit_finance_crypto stockmarket,investing,crypto,economicnews,wallstreetbets finance 25"
          - id: github_all
            module: github_trending.py
            args: "github_all"
          - id: github_python_ts
            module: github_trending.py
            args: "github_python_ts python typescript"
          - id: rss_world
            module: rss.py
            args: "rss_world rss_world"
          - id: rss_tech
            module: rss.py
            args: "rss_tech rss_tech"
          - id: rss_finance
            module: rss.py
            args: "rss_finance rss_finance"
          - id: rss_science_space
            module: rss.py
            args: "rss_science_space rss_science_space"
          - id: crypto_anomalies
            module: crypto.py
            args: "crypto_anomalies 4 30"
          - id: stocks_movers
            module: stocks.py
            args: "stocks_movers 2.5"
          - id: usgs_quakes
            module: usgs.py
            args: "usgs_quakes 4.0"
          - id: weather_alerts
            module: weather.py
            args: "weather_alerts"
          - id: youtube_trending
            module: stub.py
            args: "youtube_trending"
          - id: twitter_x_trends
            module: stub.py
            args: "twitter_x_trends"
          - id: producthunt_launches
            module: stub.py
            args: "producthunt_launches"
    env:
      PULSEMAP_OUT: out/${{ matrix.id }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_API_BEARER: ${{ secrets.X_API_BEARER }}
      PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        if: ${{ inputs.runner == '' || inputs.runner == matrix.id }}
        run: python collectors/${{ matrix.module }} ${{ matrix.args }}
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.id }}
          path: out/${{ matrix.id }}/*.json
          if-no-files-found: error

  aggregate:
    name: Aggregate + commit data
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: snapshots
          merge-multiple: true
      - name: Aggregate snapshots
        run: python scripts/aggregate.py --snapshots snapshots --data data --ts "$(date -u +%Y%m%dT%H%M%SZ)"
      - name: Commit to git data store
        run: |
          git config user.name "pulsemap-bot"
          git config user.email "bot@pulsemap.dev"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "radar snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Upload site bundle
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages
      - name: Report
        run: echo "dashboard live at https://$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z').github.io/${{ github.event.repository.name }}/"
